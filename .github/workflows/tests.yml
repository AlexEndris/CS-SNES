name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  CPU_TEST_DATA: tests/SingleStepTests/65618
  SPC_TEST_DATA: tests/SingleStepTests/spc700
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write          # needed by the test reporter to create the check run

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1     # submodules handled separately below, via the cache

      # The commits the repository pins each submodule to. Each is its own cache
      # key, so updating one test set doesn't invalidate the other's cache.
      - name: Get test-data commits
        id: testdata
        run: |
          echo "cpu=$(git rev-parse HEAD:${CPU_TEST_DATA})" >> "$GITHUB_OUTPUT"
          echo "spc=$(git rev-parse HEAD:${SPC_TEST_DATA})" >> "$GITHUB_OUTPUT"

      # ---- 65C816 test data -------------------------------------------------
      # Restore and save are split so the cache is written straight after the
      # fetch, even if the tests later fail.
      - name: Restore 65C816 test data
        id: cpu-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPU_TEST_DATA }}
          key: singlestep-65816-${{ steps.testdata.outputs.cpu }}

      - name: Fetch 65C816 test data
        if: steps.cpu-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 "${CPU_TEST_DATA}"

      - name: Save 65C816 test data
        if: steps.cpu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CPU_TEST_DATA }}
          key: singlestep-65816-${{ steps.testdata.outputs.cpu }}

      # ---- SPC700 test data -------------------------------------------------
      - name: Restore SPC700 test data
        id: spc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SPC_TEST_DATA }}
          key: singlestep-spc700-${{ steps.testdata.outputs.spc }}

      - name: Fetch SPC700 test data
        if: steps.spc-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 "${SPC_TEST_DATA}"

      - name: Save SPC700 test data
        if: steps.spc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SPC_TEST_DATA }}
          key: singlestep-spc700-${{ steps.testdata.outputs.spc }}

      # ---- Build and test ---------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Requires global.json opting dotnet test into Microsoft.Testing.Platform.
      # --report-xunit-trx is built into xUnit v3; no extra package needed.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --results-directory TestResults
          --report-xunit-trx

      # Turns the TRX file into a check run on the pull request:
      # passed / failed / skipped counts, with failure messages per test.
      - name: Test report
        if: always()         # report failures too, not only successes
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      # The raw TRX, downloadable from the run page.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/